<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Video Retrieval System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">

    <!-- Sidebar -->
    <div class="sidebar">

        <h2>Video Retrieval</h2>

        <div class="menu-group">
            <label>Search</label>
            <input type="text" id="query" placeholder="Enter query...">
        </div>

        <div class="menu-group">
            <label>Top K</label>
            <select id="topk">
                <option value="10">10</option>
                <option value="20">20</option>
                <option value="30">30</option>
            </select>
        </div>

        <button onclick="search()">🔍 Ask AI Search</button>

    </div>

    <!-- Main -->
    <div class="main">

        <h1>Video Retrieval System</h1>

        <video id="videoPlayer" controls style="width:100%; margin-bottom:10px;"></video>

        <button id="backBtn" onclick="backToSearch()" style="display:none; margin-bottom:10px;">
            ⬅ Back to Video Search
        </button>

        <div class="pagination">
            <button onclick="changePage(-1)">⬅ Prev</button>
            <span id="pageInfo">Page 1</span>
            <button onclick="changePage(1)">Next ➡</button>
        </div>

        <div id="results" class="gallery"></div>

    </div>

</div>

<script src="app.js"></script>

</body>
</html>
